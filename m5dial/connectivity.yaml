wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:

captive_portal:

api:
  on_client_connected:
    - lambda: |-
        ESP_LOGI("api", "Home Assistant connected!");
        id(ha_connected) = true;
    - lvgl.widget.hide:
        id: connecting_overlay
    - lvgl.widget.show:
        id: height_label
    - lvgl.widget.show:
        id: mode_label
    - delay: 500ms
    - script.execute: update_preset_labels
  on_client_disconnected:
    - lambda: |-
        ESP_LOGI("api", "Home Assistant disconnected!");
        id(ha_connected) = false;
    - lvgl.widget.show:
        id: connecting_overlay
    - lvgl.widget.hide:
        id: height_label
    - lvgl.widget.hide:
        id: mode_label

ota:
  - platform: esphome

logger:
