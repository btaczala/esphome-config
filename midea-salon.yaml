substitutions:
  node_name: klima-salon
  node_id: klima_salon
  friendly_node_name: "Klima Salon"

esphome:
  name: ${node_name}
  comment: ${friendly_node_name}
  name_add_mac_suffix: true
  project:
    name: "lizardsystems.midea_mini_dongle"
    version: "1.4.0"

esp8266:
  board: esp12e

wifi:
  # dane do wifi pobierane z pliku secret.yaml 
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "AC-wifi"
    password: "slwf01pro"

captive_portal:

dashboard_import:
  package_import_url: github://lizardsystems/midea-mini-dongle/edit/main/midea_ac.yaml

logger:
  baud_rate: 0
  esp8266_store_log_strings_in_flash: false

ota:
  - platform: esphome

web_server:
  port: 80
  local: true
  version: 2

api:

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

climate:
  - platform: midea
    name: ${friendly_node_name}
    id: ${node_id}_climate
    period: 1s
    timeout: 2s
    num_attempts: 3
    autoconf: true
    beeper: true
    visual:
      min_temperature: 17
      max_temperature: 30
      temperature_step: 1
    supported_modes:
      - FAN_ONLY
      - HEAT_COOL
      - COOL
      - HEAT
      - DRY
    custom_fan_modes:
      - SILENT
      - TURBO
    supported_presets:
      - ECO
      - BOOST
      - SLEEP
    custom_presets:
      - FREEZE_PROTECTION
    supported_swing_modes:
      - VERTICAL
      - HORIZONTAL
      - BOTH

switch:
  - platform: template
    name: ${friendly_node_name} Dźwięki (Beep)
    icon: mdi:volume-source
    restore_mode: RESTORE_DEFAULT_ON 
    optimistic: true
    turn_on_action:
      midea_ac.beeper_on:
    turn_off_action:
      midea_ac.beeper_off:

binary_sensor:
  - platform: status
    name: ${friendly_node_name} Status połączenia
    id: ${node_id}_connection_status

text_sensor:
  - platform: template
    name: Czas pracy (tekstowo)
    id: uptime_human
    icon: mdi:clock-start

  - platform: version
    name: ${friendly_node_name} Wersja ESPHome
    id: ${node_id}_esphome_version

  - platform: wifi_info
    ip_address:
      name: ${friendly_node_name} Adres IP
      id: ${node_id}_ip_address
      icon: mdi:ip-network

sensor:
  - platform: uptime
    name: Czas pracy (sensor)
    id: uptime_sensor
    update_interval: 60s
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            state: !lambda |-
              int seconds = round(id(uptime_sensor).raw_state);
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds /  60;
              seconds = seconds % 60;
              return (
                (days ? to_string(days) + "d " : "") +
                (hours ? to_string(hours) + "h " : "") +
                (minutes ? to_string(minutes) + "m " : "") +
                (to_string(seconds) + "s")
              ).c_str();
  - platform: wifi_signal
    name: ${friendly_node_name} Sygnał WiFi
    id: ${node_id}_wifi_signal
    update_interval: 60s

select:
  - platform: template
    name: "${friendly_node_name} Sterowanie Nawiewem"
    id: klima_swing_selector
    icon: mdi:air-conditioner
    options:
      - "OFF"
      - "VERTICAL"
      - "HORIZONTAL"
      - "BOTH"
    initial_option: "OFF"
    optimistic: true
    set_action:
      then:
        - climate.control:
            id: ${node_id}_climate
            swing_mode: !lambda |-
              if (x == "VERTICAL") return CLIMATE_SWING_VERTICAL;
              if (x == "HORIZONTAL") return CLIMATE_SWING_HORIZONTAL;
              if (x == "BOTH") return CLIMATE_SWING_BOTH;
              return CLIMATE_SWING_OFF;


button:
  - platform: restart
    name: ${friendly_node_name} Restart
    id: ${node_id}_restart
    icon: "mdi:restart"

  - platform: safe_mode
    name: ${friendly_node_name} Restart (Tryb Awaryjny)
    id: ${node_id}_safe_mode


