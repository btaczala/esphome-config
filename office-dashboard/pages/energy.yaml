id: energy_page
bg_color: 0x0f1923
bg_opa: COVER
widgets:

  # ── SOLAR CARD (x=10, w=248) ─────────────────────────────────────────
  - obj:
      x: 10
      y: 75
      width: 248
      height: 184
      bg_color: 0x162030
      bg_opa: COVER
      radius: 12
      border_width: 1
      border_color: 0x1e3050
      pad_all: 12
      widgets:
        - label:
            align: TOP_MID
            y: 2
            text: "SOLAR"
            text_font: montserrat_14
            text_color: 0x4a6a8a
        - meter:
            id: solar_meter
            align: CENTER
            y: -6
            width: 90
            height: 90
            scales:
              - range_from: 0
                range_to: ${solar_max_kw}0
                angle_range: 240
                rotation: 150
                ticks:
                  count: 0
                indicators:
                  - arc:
                      id: solar_arc
                      color: 0xf5c400
                      width: 8
                      start_value: 0
                      end_value: 0
                  - line:
                      id: solar_needle
                      width: 6
                      color: 0x161616
                      value: 50
                      r_mod: 10
        - label:
            id: energy_solar_label
            align: BOTTOM_MID
            y: -2
            text: "--- kW"
            text_font: montserrat_20
            text_color: 0xf5c400

  # ── CONSUMPTION CARD (x=268, w=253) ──────────────────────────────────
  - obj:
      x: 268
      y: 75
      width: 253
      height: 184
      bg_color: 0x162030
      bg_opa: COVER
      radius: 12
      border_width: 1
      border_color: 0x1e3050
      pad_all: 12
      widgets:
        - label:
            align: TOP_MID
            y: 5
            text: "CONSUMPTION"
            text_font: montserrat_14
            text_color: 0x4a6a8a
        - label:
            id: energy_consumption_label
            align: CENTER
            text: "--- kW"
            text_font: montserrat_28
            text_color: 0xff5555

  # ── BATTERY CARD (x=531, w=259) ──────────────────────────────────────
  - obj:
      x: 531
      y: 75
      width: 259
      height: 184
      bg_color: 0x162030
      bg_opa: COVER
      radius: 12
      border_width: 1
      border_color: 0x1e3050
      pad_all: 12
      widgets:
        - label:
            align: TOP_MID
            y: 5
            text: "BATTERY"
            text_font: montserrat_14
            text_color: 0x4a6a8a
        - label:
            id: energy_battery_soc_label
            align: CENTER
            y: -15
            text: "---%"
            text_font: montserrat_28
            text_color: 0x44cc66
        - obj:
            align: CENTER
            y: 20
            width: 90%
            height: 1
            bg_color: 0x1e3050
            bg_opa: COVER
            border_width: 0
            pad_all: 0
        - label:
            id: energy_battery_flow_label
            align: BOTTOM_MID
            y: -12
            text: "--- kW"
            text_font: montserrat_18
            text_color: 0x8899aa

  # ── TODAY + FORECAST CARD (x=10, w=380) ──────────────────────────────
  - obj:
      x: 10
      y: 266
      width: 380
      height: 174
      bg_color: 0x162030
      bg_opa: COVER
      radius: 12
      border_width: 1
      border_color: 0x1e3050
      pad_all: 12
      widgets:
        - label:
            align: TOP_MID
            y: 4
            text: "TODAY"
            text_font: montserrat_14
            text_color: 0x4a6a8a
        - label:
            id: energy_today_label
            align: TOP_MID
            x: 0
            y: 26
            text: "--- / --- kWh"
            text_font: montserrat_18
            text_color: 0xf5c400
        - bar:
            id: energy_today_bar
            align: TOP_LEFT
            x: 0
            y: 66
            width: 100%
            height: 20
            min_value: 0
            max_value: 100
            value: 0
            indicator:
              bg_color: 0xf5c400
              bg_opa: COVER
              radius: 3
            bg_color: 0x0d1825
            bg_opa: COVER
            border_width: 0
            radius: 3

  # ── PRICE CARD (x=398, w=392) ─────────────────────────────────────────
  - obj:
      x: 398
      y: 266
      width: 392
      height: 174
      bg_color: 0x162030
      bg_opa: COVER
      radius: 12
      border_width: 1
      border_color: 0x1e3050
      pad_all: 12
      widgets:
        - label:
            align: TOP_MID
            y: 5
            text: "ENERGY PRICE"
            text_font: montserrat_14
            text_color: 0x4a6a8a
        - label:
            id: energy_price_label
            align: CENTER
            y: -15
            text: "---"
            text_font: montserrat_28
            text_color: 0x18bcf2
        - obj:
            align: CENTER
            y: 20
            width: 90%
            height: 1
            bg_color: 0x1e3050
            bg_opa: COVER
            border_width: 0
            pad_all: 0
        - label:
            align: BOTTOM_LEFT
            x: 5
            y: -8
            text: "Min"
            text_font: montserrat_12
            text_color: 0x4a6a8a
        - label:
            id: energy_price_min_label
            align: BOTTOM_LEFT
            x: 5
            y: -24
            text: "---"
            text_font: montserrat_16
            text_color: 0x44cc66
        - label:
            align: BOTTOM_RIGHT
            x: -5
            y: -8
            text: "Max"
            text_font: montserrat_12
            text_color: 0x4a6a8a
        - label:
            id: energy_price_max_label
            align: BOTTOM_RIGHT
            x: -5
            y: -24
            text: "---"
            text_font: montserrat_16
            text_color: 0xff5555

  # ── PAGE NAV FOOTER ──────────────────────────────────────────────────
  - obj:
      x: 0
      y: 450
      width: 800
      height: 30
      bg_color: 0x0a1020
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 0
      widgets:
        - button:
            align: CENTER
            x: -14
            width: 10
            height: 10
            radius: 5
            bg_color: 0x334466
            border_width: 0
            on_click:
              - lvgl.page.show: main_page
        - obj:
            align: CENTER
            x: 14
            width: 10
            height: 10
            radius: 5
            bg_color: 0x18bcf2
            border_width: 0
