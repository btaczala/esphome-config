lvgl:
  displays:
    - touch_4_3
  touchscreens:
    - my_touchscreen
  on_idle:
    - timeout: 2min
      then:
        - lvgl.page.show: screensaver_page
        - lambda: id(screensaver_active) = true;
    - timeout: 10min
      then:
        - switch.turn_off: screen_switch
        - lambda: id(screensaver_active) = false;
  top_layer:
    widgets:
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - label:
                align: CENTER
                y: -20
                text: "Connecting to Home Assistant..."
                text_color: 0xFFFFFF
            - spinner:
                align: CENTER
                y: 40
                height: 50
                width: 50
                spin_time: 1s
                arc_length: 60deg
                arc_width: 8
                indicator:
                  arc_color: 0x18bcf2
                  arc_width: 8

  pages:
    - !include pages/overview.yaml
    - !include pages/page2.yaml
    - !include pages/screensaver.yaml
