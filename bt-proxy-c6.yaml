substitutions:
  device_name: bt-proxy-c3-sheed

esphome:
  name: ${device_name}
  friendly_name: "BT Proxy C3 shed"

esp32:
  board: seeed_xiao_esp32c3
  flash_size: 4MB
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y

logger:
  hardware_uart: UART0

api:
  encryption:
    key: "HLpdtghpKIjlp/vNG4R+zNk+Z9bL0excURSNAiagufE="

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.20.238
    gateway: 192.168.20.1
    subnet: 255.255.255.0
  ap:
    ssid: "${device_name} Fallback"
    password: !secret wifi_password

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ssid:
      name: "WiFi SSID"
    ip_address:
      name: "IP Address"

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
web_server:
