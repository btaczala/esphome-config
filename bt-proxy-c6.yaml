substitutions:
  device_name: bt-proxy-c3-sheed

esphome:
  name: ${device_name}
  friendly_name: "BT Proxy C3 shed"

esp32:
  board: seeed_xiao_esp32c3
  flash_size: 4MB
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y

logger:
  hardware_uart: UART0

api:
  encryption:
    key: "HLpdtghpKIjlp/vNG4R+zNk+Z9bL0excURSNAiagufE="

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
