substitutions:
  device_name: esp-ultrasonic

esphome:
  name: ${device_name}
  friendly_name: "ESPHOME Ultrasonic Sensor"
  on_boot:
    priority: 100.0
    then:
      - logger.log:
          format: "Hello world"
          level: INFO

esp32:
  board: seeed_xiao_esp32c6
  flash_size: 4MB
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y

# Enable logging
logger:
  hardware_uart: USB_SERIAL_JTAG
  logs:
    wifi_info: ERROR
    wifi_signal: ERROR
    wifi: ERROR

# Enable Home Assistant API
api:
  encryption:
    key: "MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# A02YYUW UART wiring (XIAO ESP32-C6):
#   Sensor VCC (red)    → 5V
#   Sensor GND (black)  → GND
#   Sensor TX (yellow)  → D9 / GPIO20 (ESP RX)
#   Sensor RX (white)   → D10 / GPIO18 (ESP TX)
uart:
  id: uart_bus
  tx_pin: GPIO18
  rx_pin: GPIO20
  baud_rate: 9600

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${device_name} IP Address
    ssid:
      name: ${device_name} SSID
    mac_address:
      name: ${device_name} Mac Address


sensor:
  - platform: wifi_signal
    name: ${device_name} rssi
    update_interval: 60s
  - platform: "a02yyuw"
    name: "Distance"

web_server:
  port: 80
