substitutions:
  name: waveshare-s3-touch
  friendly_name: Waveshare S3 4.3
  # Entity IDs – adjust to match your Home Assistant setup
  weather_entity: weather.forecast_home
  weather_temp_entity: sensor.pirateweather_temperature
  weather_humidity_entity: sensor.pirateweather_humidity
  floor_heating_entity: climate.termostat_biuro_thermostat
  hvac_entity: climate.klimatyzacja_biuro
  occupancy_entity: binary_sensor.zajetosc_biura
  solar_max_kw: "10"
  solar_production_entity: sensor.produkcja_energii_4
  home_consumption_entity: sensor.zuzycie_energii_3
  battery_usage_entity: sensor.zuzycie_baterii_2
  battery_soc_entity: sensor.pv_naladowanie_baterii_2
  energy_today_entity: sensor.energia_wyprodukowana_dzisiaj
  solar_forecast_entity: sensor.solcast_pv_forecast_prognoza_na_dzisiaj
  energy_price_entity: sensor.rce_pse_cena
  energy_price_min_entity: sensor.rce_pse_minimalna_cena_dzisiaj
  energy_price_max_entity: sensor.rce_pse_maksymalna_cena_dzisiaj

esphome:
  name: "${name}"
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.flash_mode: dio
    board_upload.maximum_ram_size: 524288
  on_boot:
    - output.turn_on: backlight_output

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y

logger:

ch422g:
  - id: ch422g_hub

output:
  - platform: gpio
    pin:
      ch422g: ch422g_hub
      number: 2
    id: backlight_output

switch:
  - platform: template
    name: Screen
    id: screen_switch
    restore_mode: ALWAYS_ON
    optimistic: true
    turn_on_action:
      - lvgl.resume
      - output.turn_on: backlight_output
      - lvgl.widget.show: top_bar
    turn_off_action:
      - lvgl.pause:
          show_snow: false
      - output.turn_off: backlight_output

psram:
  mode: octal
  speed: 80MHz

i2c:
  sda: 8
  scl: 9
  scan: true
  frequency: 400kHz

globals:
  - id: swipe_start_x
    type: int
    initial_value: '0'
  - id: swipe_current_x
    type: int
    initial_value: '0'
  - id: swipe_tracking
    type: bool
    initial_value: 'false'
  - id: screensaver_active
    type: bool
    initial_value: 'false'
  - id: energy_today_val
    type: float
    initial_value: '0'
  - id: solar_forecast_val
    type: float
    initial_value: '0'

touchscreen:
  - platform: gt911
    id: my_touchscreen
    interrupt_pin: 4
    reset_pin:
      ch422g: ch422g_hub
      number: 1
    on_touch:
      - if:
          condition:
            switch.is_off: screen_switch
          then:
            # Wake from blank: restore main page
            - switch.turn_on: screen_switch
            - lvgl.page.show: main_page
            - lambda: id(screensaver_active) = false;
          else:
            - if:
                condition:
                  lambda: 'return id(screensaver_active);'
                then:
                  # Dismiss screensaver on any touch
                  - lvgl.page.show: main_page
                  - lambda: id(screensaver_active) = false;
                  - lvgl.widget.show: top_bar
                else:
                  - lambda: |-
                      id(swipe_start_x) = touch.x;
                      id(swipe_current_x) = touch.x;
                      id(swipe_tracking) = true;
    on_update:
      - lambda: |-
          if (id(swipe_tracking) && !touches.empty()) {
            id(swipe_current_x) = touches[0].x;
          }
    on_release:
      - lambda: id(swipe_tracking) = false;
      - if:
          condition:
            lambda: 'return !id(screensaver_active) && (id(swipe_start_x) - id(swipe_current_x)) > 80;'
          then:
            - lvgl.page.show: energy_page
      - if:
          condition:
            lambda: 'return !id(screensaver_active) && (id(swipe_current_x) - id(swipe_start_x)) > 80;'
          then:
            - lvgl.page.show: main_page

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: touch_4_3

time:
  - platform: homeassistant
    id: esptime
    on_time_sync:
      then:
        - lvgl.label.update:
            id: time_label
            text: !lambda |-
              char buf[6];
              auto t = id(esptime).now();
              snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
              return std::string(buf);
        - lvgl.label.update:
            id: date_label
            text: !lambda 'return id(esptime).now().strftime("%a, %b %d");'
        - lvgl.label.update:
            id: screensaver_time_label
            text: !lambda |-
              char buf[6];
              auto t = id(esptime).now();
              snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
              return std::string(buf);
        - lvgl.label.update:
            id: screensaver_date_label
            text: !lambda 'return id(esptime).now().strftime("%a, %b %d");'
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - lvgl.label.update:
              id: time_label
              text: !lambda |-
                char buf[6];
                auto t = id(esptime).now();
                snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
                return std::string(buf);
          - lvgl.label.update:
              id: date_label
              text: !lambda 'return id(esptime).now().strftime("%a, %b %d");'
          - lvgl.label.update:
              id: screensaver_time_label
              text: !lambda |-
                char buf[6];
                auto t = id(esptime).now();
                snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
                return std::string(buf);
          - lvgl.label.update:
              id: screensaver_date_label
              text: !lambda 'return id(esptime).now().strftime("%a, %b %d");'

sensor:
  # Weather – adjust entity IDs to match your HA setup
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: ${weather_temp_entity}
    on_value:
      - lvgl.label.update:
          id: weather_temp_label
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return std::string(buf);

  - platform: homeassistant
    id: outdoor_humidity
    entity_id: ${weather_humidity_entity}
    on_value:
      - lvgl.label.update:
          id: weather_humidity_label
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            return std::string(buf);

  # Floor heating – reads attributes from climate entity
  - platform: homeassistant
    id: floor_current_temp
    entity_id: ${floor_heating_entity}
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: floor_temp_label
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.1f°C", x);
            return std::string(buf);

  - platform: homeassistant
    id: floor_setpoint
    entity_id: ${floor_heating_entity}
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: floor_setpoint_label
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return std::string(buf);

  # HVAC – reads attributes from climate entity
  - platform: homeassistant
    id: hvac_current_temp
    entity_id: ${hvac_entity}
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: hvac_temp_label
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.1f°C", x);
            return std::string(buf);

  - platform: homeassistant
    id: hvac_setpoint
    entity_id: ${hvac_entity}
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: hvac_setpoint_label
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return std::string(buf);

  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic

  # Energy sensors
  - platform: homeassistant
    id: solar_production
    entity_id: ${solar_production_entity}
    on_value:
      - lvgl.label.update:
          id: energy_solar_label
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.2f kW", x);
            return std::string(buf);
      - lvgl.indicator.update:
          id: solar_arc
          end_value: !lambda 'return (int)(x * 10);'
      - lvgl.indicator.update:
          id: solar_needle
          value: !lambda 'return (int)(x * 10);'

  - platform: homeassistant
    id: home_consumption
    entity_id: ${home_consumption_entity}
    on_value:
      - lvgl.label.update:
          id: energy_consumption_label
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.2f kW", x);
            return std::string(buf);

  - platform: homeassistant
    id: battery_usage
    entity_id: ${battery_usage_entity}
    on_value:
      - lvgl.label.update:
          id: energy_battery_flow_label
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.2f kW", x);
            return std::string(buf);

  - platform: homeassistant
    id: battery_soc
    entity_id: ${battery_soc_entity}
    on_value:
      - lvgl.label.update:
          id: energy_battery_soc_label
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            return std::string(buf);
      - lambda: |-
          lv_obj_t* icon = id(battery_icon_label);
          const char* glyph;
          lv_color_t color;
          if (x < 5)        { glyph = "\U000F008E"; color = lv_color_hex(0xff3333); }  // empty
          else if (x < 15)  { glyph = "\U000F007A"; color = lv_color_hex(0xff3333); }  // 10%
          else if (x < 25)  { glyph = "\U000F007B"; color = lv_color_hex(0xff9900); }  // 20%
          else if (x < 35)  { glyph = "\U000F007C"; color = lv_color_hex(0xff9900); }  // 30%
          else if (x < 45)  { glyph = "\U000F007D"; color = lv_color_hex(0xffcc00); }  // 40%
          else if (x < 60)  { glyph = "\U000F007E"; color = lv_color_hex(0xffcc00); }  // 50%
          else if (x < 75)  { glyph = "\U000F0080"; color = lv_color_hex(0xaacc44); }  // 70%
          else if (x < 85)  { glyph = "\U000F0081"; color = lv_color_hex(0x44cc66); }  // 80%
          else if (x < 95)  { glyph = "\U000F0082"; color = lv_color_hex(0x44cc66); }  // 90%
          else              { glyph = "\U000F0079"; color = lv_color_hex(0x44cc66); }  // full
          lv_label_set_text(icon, glyph);
          lv_obj_set_style_text_color(icon, color, LV_PART_MAIN);

  - platform: homeassistant
    id: energy_today
    entity_id: ${energy_today_entity}
    on_value:
      - lambda: id(energy_today_val) = x;
      - lvgl.label.update:
          id: energy_today_label
          text: !lambda |-
            char buf[20];
            snprintf(buf, sizeof(buf), "%.1f / %.1f kWh", id(energy_today_val), id(solar_forecast_val));
            return std::string(buf);
      - lvgl.bar.update:
          id: energy_today_bar
          value: !lambda 'return (int)(x * 10);'

  - platform: homeassistant
    id: solar_forecast
    entity_id: ${solar_forecast_entity}
    on_value:
      - lambda: id(solar_forecast_val) = x;
      - lvgl.label.update:
          id: energy_today_label
          text: !lambda |-
            char buf[20];
            snprintf(buf, sizeof(buf), "%.1f / %.1f kWh", id(energy_today_val), id(solar_forecast_val));
            return std::string(buf);
      - lvgl.bar.update:
          id: energy_today_bar
          max_value: !lambda 'return (int)(x * 10);'
          min_value: 0

  - platform: homeassistant
    id: energy_price
    entity_id: ${energy_price_entity}
    on_value:
      - lvgl.label.update:
          id: energy_price_label
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.2f", x);
            return std::string(buf);

  - platform: homeassistant
    id: energy_price_min
    entity_id: ${energy_price_min_entity}
    on_value:
      - lvgl.label.update:
          id: energy_price_min_label
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.2f", x);
            return std::string(buf);

  - platform: homeassistant
    id: energy_price_max
    entity_id: ${energy_price_max_entity}
    on_value:
      - lvgl.label.update:
          id: energy_price_max_label
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.2f", x);
            return std::string(buf);

text_sensor:
  # Weather condition state (e.g. "sunny", "cloudy") – adjust entity to your weather integration
  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}
    on_value:
      - lvgl.label.update:
          id: weather_condition_label
          text: !lambda 'return x;'
      - lambda: |-
          const std::string& ws = x;
          const char* glyph;
          lv_color_t color;
          if (ws == "cloudy")             { glyph = "\U000F0590"; color = lv_color_hex(0x889aaa); }
          else if (ws == "exceptional")   { glyph = "\U000F0026"; color = lv_color_hex(0xff7030); }
          else if (ws == "fog")           { glyph = "\U000F0591"; color = lv_color_hex(0xaabbcc); }
          else if (ws == "hail")          { glyph = "\U000F0592"; color = lv_color_hex(0xaaccee); }
          else if (ws == "lightning")     { glyph = "\U000F0593"; color = lv_color_hex(0xffcc00); }
          else if (ws == "lightning-rainy") { glyph = "\U000F067E"; color = lv_color_hex(0xffcc00); }
          else if (ws == "partlycloudy")  { glyph = "\U000F0595"; color = lv_color_hex(0xf5c400); }
          else if (ws == "pouring")       { glyph = "\U000F0596"; color = lv_color_hex(0x18bcf2); }
          else if (ws == "rainy")         { glyph = "\U000F0597"; color = lv_color_hex(0x18bcf2); }
          else if (ws == "snowy")         { glyph = "\U000F0598"; color = lv_color_hex(0xaaccee); }
          else if (ws == "snowy-rainy")   { glyph = "\U000F067F"; color = lv_color_hex(0xaaccee); }
          else if (ws == "sunny")         { glyph = "\U000F0599"; color = lv_color_hex(0xf5c400); }
          else if (ws == "windy")         { glyph = "\U000F059D"; color = lv_color_hex(0x44ccaa); }
          else if (ws == "windy-variant") { glyph = "\U000F059E"; color = lv_color_hex(0x44ccaa); }
          else                            { glyph = "\U000F0599"; color = lv_color_hex(0xccddee); }
          lv_label_set_text(id(weather_icon_label), glyph);
          lv_obj_set_style_text_color(id(weather_icon_label), color, LV_PART_MAIN);

  # Climate entity state is the HVAC mode string ("heat", "off", "cool", etc.)
  - platform: homeassistant
    id: floor_heating_state
    entity_id: ${floor_heating_entity}
    on_value:
      - lvgl.label.update:
          id: floor_state_label
          text: !lambda 'return x;'

  - platform: homeassistant
    id: hvac_mode
    entity_id: ${hvac_entity}
    on_value:
      - lvgl.label.update:
          id: hvac_mode_label
          text: !lambda 'return x;'

  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic

script:
  - id: refresh_occupancy
    then:
      - if:
          condition:
            binary_sensor.is_on: office_occupancy
          then:
            - lvgl.label.update:
                id: occupancy_dot
                text_color: 0x00cc44
            - lvgl.label.update:
                id: occupancy_text
                text: "Occupied"
                text_color: 0x00cc44
          else:
            - lvgl.label.update:
                id: occupancy_dot
                text_color: 0x555555
            - lvgl.label.update:
                id: occupancy_text
                text: "Unoccupied"
                text_color: 0x888888

interval:
  - interval: 15s
    then:
      - if:
          condition:
            lambda: 'return id(screensaver_active);'
          then:
            - lambda: |-
                // Screen 800×480, container 400×110 — keep 20px margin on all sides
                int new_x = 20 + (esp_random() % 381);  // 20 to 400
                int new_y = 20 + (esp_random() % 331);  // 20 to 350
                lv_obj_set_pos(id(screensaver_container), new_x, new_y);

binary_sensor:
  - platform: homeassistant
    id: office_occupancy
    entity_id: ${occupancy_entity}
    on_state:
      - script.execute: refresh_occupancy

  - platform: homeassistant
    id: dnd_switch
    entity_id: switch.nie_przeszkadzac
    on_state:
      - if:
          condition:
            binary_sensor.is_on: dnd_switch
          then:
            - lvgl.widget.show: dnd_overlay
            - lambda: 'lv_animimg_start(id(dnd_overlay));'
          else:
            - lvgl.widget.hide: dnd_overlay

api:
  on_client_connected:
    - lvgl.widget.hide: boot_screen
    - delay: 1s
    - script.execute: refresh_occupancy

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  lvgl: !include office-dashboard/lvgl.yaml

animation:
  - file: office-dashboard/nie_przeszkadzac.gif
    id: dnd_gif
    type: RGB565

font:
  - file: "materialdesignicons-webfont.ttf"
    id: mdi_fonts
    size: 42
    bpp: 4
    glyphs: [
      "\U000F0D91",
      "\U000F008E", "\U000F007A", "\U000F007B", "\U000F007C", "\U000F007D",
      "\U000F007E", "\U000F0079", "\U000F0080", "\U000F0081", "\U000F0082",
      "\U000F0590", "\U000F0026", "\U000F0591", "\U000F0592", "\U000F0593",
      "\U000F067E", "\U000F0595", "\U000F0596", "\U000F0597", "\U000F0598",
      "\U000F067F", "\U000F0599", "\U000F059D", "\U000F059E"
    ]
